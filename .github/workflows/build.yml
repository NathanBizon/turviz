name: Build desktop distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: turviz-windows
            archive: TurViz-windows.zip
          - os: macos-latest
            artifact: turviz-macos
            archive: TurViz-macos.zip
          - os: ubuntu-latest
            artifact: turviz-linux
            archive: TurViz-linux.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install project
        run: uv sync

      - name: Build executable
        run: uv run --with pyinstaller pyinstaller --noconfirm --clean --windowed --name TurViz src/turviz/__main__.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TurViz -DestinationPath "dist/${{ matrix.archive }}"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/TurViz.app "dist/${{ matrix.archive }}"

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf "dist/${{ matrix.archive }}" -C dist TurViz

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.14
      - name: Run tests
        run: uv run pytest -q
